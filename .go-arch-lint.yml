version: 3
workdir: .
allow:
  depOnAnyVendor: false

excludeFiles:
  - "^.*_test\\.go$"
  - "^cmd/atlas-loader/.*$"

vendors:
  pgx:        { in: github.com/jackc/pgx }
  aws:        { in: github.com/aws/aws-sdk-go-v2 }
  atlas:      { in: ariga.io/atlas }
  uuid:       { in: github.com/google/uuid }
  jsonschema: { in: github.com/santhosh-tekuri/jsonschema }
  ximage:     { in: golang.org/x/image }
  xcrypto:    { in: golang.org/x/crypto/** }
  jwt:        { in: github.com/golang-jwt }

components:
  pkg_config:      { in: pkg/config }
  pkg_postgres:    { in: pkg/postgres }
  pkg_environment: { in: pkg/environment }
  pkg_publication: { in: pkg/publication }
  pkg_artifact:    { in: pkg/artifact }
  pkg_secrets:     { in: pkg/secrets }
  pkg_site:        { in: pkg/site }
  pkg_storage:     { in: pkg/storage }
  pkg_s3:          { in: pkg/storage/s3 }
  pkg_static:      { in: pkg/static }
  pkg_https:       { in: pkg/https }
  pkg_validate:    { in: pkg/platform/validate }
  pkg_models:      { in: pkg/models }
  pkg_response:    { in: pkg/response }

  feat_auth:     { in: features/auth }
  feat_features: { in: features/features }
  feat_content:  { in: features/content }
  feat_forms:    { in: features/forms }
  feat_media:    { in: features/media }
  feat_overview: { in: features/overview }
  feat_releases: { in: features/releases }
  feat_provider: { in: features/releases/provider }
  feat_settings: { in: features/settings }

  handlers:      { in: presentation/http/handlers/** }
  middleware:    { in: presentation/http/middleware/** }
  routes:        { in: presentation/http }
  presentation:  { in: presentation/** }
  migrations:    { in: migrations }
  pkg_principal: { in: pkg/principal }

  cmd_api:        { in: cmd/api }
  cmd_atlas:      { in: cmd/atlas-loader }
  cmd_integ:      { in: cmd/integration }

commonComponents:
  - pkg_models
  - pkg_environment
  - pkg_publication
  - pkg_artifact
  - pkg_response

deps:
  pkg_config:      { anyVendorDeps: true }
  pkg_postgres:    { anyVendorDeps: true }
  pkg_environment: { anyVendorDeps: true }
  pkg_publication: { anyVendorDeps: true }
  pkg_artifact:    { anyVendorDeps: true }
  pkg_secrets:     { anyVendorDeps: true }
  pkg_site:        { mayDependOn: [pkg_environment, pkg_storage], anyVendorDeps: true, deepScan: false }
  pkg_storage:     { mayDependOn: [pkg_environment], anyVendorDeps: true }
  pkg_s3:          { mayDependOn: [pkg_storage, pkg_environment, pkg_config], anyVendorDeps: true, deepScan: false }
  pkg_static:      { mayDependOn: [], anyVendorDeps: true }
  # deepScan: false — NewRouter receives the cmd-level domain adapter; the
  # linter derives a false cmd→pkg_https DI edge from the composition root.
  pkg_https:       { mayDependOn: [pkg_config, pkg_environment], canUse: [xcrypto], anyVendorDeps: false, deepScan: false }
  pkg_validate:    { anyVendorDeps: true }
  pkg_models:      { anyVendorDeps: true }
  pkg_response:    { anyVendorDeps: true }
  pkg_principal:   { anyVendorDeps: true }
  migrations:      { mayDependOn: [pkg_models], anyVendorDeps: true }

  feat_auth:     { mayDependOn: [pkg_postgres, pkg_validate, pkg_principal], anyVendorDeps: true }
  feat_features: { mayDependOn: [pkg_postgres, pkg_validate, pkg_principal], anyVendorDeps: true }
  # feat_content/feat_forms reference the shared Feature entity provided by
  # feat_features; the dependency is one-directional and cycle-free.
  feat_content:  { mayDependOn: [pkg_postgres, pkg_validate, pkg_principal, feat_features], anyVendorDeps: true }
  feat_forms:    { mayDependOn: [pkg_postgres, pkg_validate, pkg_principal, feat_features], anyVendorDeps: true }
  # deepScan: false for feat_media/feat_releases/pkg_site — their constructors
  # accept the storage.ObjectStore contract, but the linter derives a concrete
  # *s3.Store edge from the composition root in cmd/api (false positive).
  feat_media:    { mayDependOn: [pkg_postgres, pkg_storage, pkg_principal], anyVendorDeps: true, deepScan: false }
  feat_overview: { mayDependOn: [pkg_postgres], anyVendorDeps: true }
  # feat_settings is a pure runtime-configuration view; it imports no project
  # code. The entry stays only to keep the linter's deps schema happy.
  feat_settings: { mayDependOn: [pkg_response], anyVendorDeps: false }
  feat_releases: { mayDependOn: [pkg_postgres, pkg_storage, pkg_secrets, pkg_artifact, feat_provider, pkg_principal], anyVendorDeps: true, deepScan: false }
  feat_provider: { mayDependOn: [pkg_artifact], anyVendorDeps: true }

  handlers:   { mayDependOn: [pkg_response, pkg_principal, feat_auth, feat_features, feat_content, feat_forms, feat_media, feat_overview, feat_releases, feat_settings], anyVendorDeps: true }
  middleware: { mayDependOn: [pkg_response, pkg_principal, feat_auth], anyVendorDeps: true }
  routes:     { mayDependOn: [pkg_site, pkg_static, pkg_response, handlers, middleware, feat_auth, feat_features, feat_content, feat_forms, feat_media, feat_overview, feat_releases], anyVendorDeps: true }
  presentation: { anyVendorDeps: true }

  cmd_api:   { mayDependOn: [pkg_config, pkg_postgres, pkg_site, pkg_storage, pkg_secrets, pkg_static, pkg_environment, pkg_publication, pkg_artifact, pkg_validate, pkg_models, pkg_s3, pkg_https, migrations, feat_auth, feat_features, feat_content, feat_forms, feat_media, feat_overview, feat_releases, feat_settings, routes, handlers], anyVendorDeps: true }
  cmd_atlas: { mayDependOn: [pkg_models], anyVendorDeps: true }
  cmd_integ: { mayDependOn: [pkg_config, pkg_postgres, pkg_site, pkg_storage, pkg_models, migrations, feat_auth, feat_features, feat_content, feat_forms, feat_media, feat_overview, feat_releases, routes, handlers], anyVendorDeps: true }

