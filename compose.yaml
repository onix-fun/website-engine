name: website-engine

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engine}
      POSTGRES_USER: ${POSTGRES_USER:-engine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engine}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # The upstream minio/minio Docker Hub repository is no longer available.
    # This community build is convenient locally; use managed S3 in production.
    image: coollabsio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  server:
    image: ${ENGINE_IMAGE:?Set ENGINE_IMAGE in .env to a published GHCR image}
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      HTTP_ADDR: ":8080"
      DEV_HTTP_ADDR: ":8081"
      PROD_HTTP_ADDR: ":8082"
      DEV_PUBLIC_BASE_URL: ${DEV_PUBLIC_BASE_URL:-http://localhost:8081}
      PROD_PUBLIC_BASE_URL: ${PROD_PUBLIC_BASE_URL:-http://localhost:8082}
      DATABASE_URL: "postgres://${POSTGRES_USER:-engine}:${POSTGRES_PASSWORD:-engine}@db:5432/${POSTGRES_DB:-engine}?sslmode=disable"
      MIGRATE_ON_START: "true"
      BOOTSTRAP_ADMIN_TOKEN: ${BOOTSTRAP_ADMIN_TOKEN:-dev-admin-token-change-me-please}
      S3_ENDPOINT: "http://minio:9000"
      S3_PUBLIC_BASE_URL: "http://localhost:9000"
      S3_BUCKET: "media"
      S3_REGION: "us-east-1"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      S3_ENSURE_BUCKET: "true"
      MAX_UPLOAD_BYTES: "20971520"
      FORM_RATE_LIMIT: "20"
      PUBLIC_CORS_ORIGINS: ${PUBLIC_CORS_ORIGINS:-}
      PUBLIC_CORS_ORIGINS_DEV: ${PUBLIC_CORS_ORIGINS_DEV:-http://localhost:8081}
      PUBLIC_CORS_ORIGINS_PROD: ${PUBLIC_CORS_ORIGINS_PROD:-http://localhost:8082}
      RELEASE_CACHE_DIR: "/data/releases"
      # 32-byte AES key (base64). Replace in production.
      RELEASE_MASTER_KEY: ${RELEASE_MASTER_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      MAX_RELEASE_BYTES: "268435456"
      RELEASE_SOURCE_HOSTS: ${RELEASE_SOURCE_HOSTS:-}
      RELEASE_SOURCE_ALLOW_INSECURE: ${RELEASE_SOURCE_ALLOW_INSECURE:-false}
      # TLS/ACME: enable by setting TLS_ENABLED=true in the .env file and
      # adding ports "443:443" and "80:80" to the server service.
      TLS_ENABLED: ${TLS_ENABLED:-false}
      HTTPS_ADDR: ${HTTPS_ADDR:-:443}
      TLS_HTTP_ADDR: ${TLS_HTTP_ADDR:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_STAGING: ${ACME_STAGING:-false}
      TLS_CACHE_DIR: "/data/tls"
      LOG_LEVEL: "info"
      TZ: "UTC"
    volumes:
      - release-cache:/data/releases
      - tls-cache:/data/tls
    ports:
      - "8080:8080"
      - "8081:8081"
      - "8082:8082"
      # Required when TLS_ENABLED=true (see .env.example).
      # - "443:443"
      # - "80:80"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  release-cache:
  tls-cache:
